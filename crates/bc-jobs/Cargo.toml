[package]
name = "bc-jobs"
version = "0.1.6"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bc-core = { version = "0.1.0", path = "../bc-core" }
bc-db = { version = "0.1.0", path = "../bc-db" }
bc-types = { version = "0.1.0", path = "../bc-types" }
chrono = "0.4.45"
parking_lot = "0.12.5"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }
tokio-util = "0.7.19"
futures = "0.3.34"

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
