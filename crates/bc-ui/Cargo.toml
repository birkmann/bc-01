[package]
name = "bc-ui"
version = "0.1.7"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bc-ui"
path = "src/main.rs"

[dependencies]
bc-types = { version = "0.1.0", path = "../bc-types" }
bc-waveform = { version = "0.1.0", path = "../bc-waveform", default-features = false, features = ["webgl"] }
bc-music = { version = "0.1.0", path = "../bc-music" }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
send_wrapper = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlCanvasElement", "HtmlImageElement",
  "Event", "KeyboardEvent", "MouseEvent", "PointerEvent", "WheelEvent", "TouchEvent", "Storage", "WebSocket",
  "MessageEvent", "CloseEvent", "ErrorEvent", "Response", "Request", "RequestInit", "Headers", "Location",
  "History", "ResizeObserver", "ResizeObserverEntry", "DomRect", "CssStyleDeclaration", "DomTokenList",
  "EventTarget", "Node", "NodeList", "MediaQueryList", "MediaQueryListEvent", "Navigator", "Clipboard", "Blob",
  "BlobPropertyBag", "Url", "File", "FileList", "FormData", "AbortController", "AbortSignal",
  "IntersectionObserver", "IntersectionObserverEntry", "DragEvent", "DataTransfer", "HtmlSelectElement",
  "HtmlTextAreaElement", "Performance", "UrlSearchParams", "ScrollToOptions", "ScrollBehavior",
  "CanvasRenderingContext2d", "WebGl2RenderingContext", "FocusEvent", "AddEventListenerOptions",
  "CustomEvent", "HtmlDialogElement", "VisibilityState", "ReadableStream", "Crypto", "HtmlAnchorElement",
  "DomRectReadOnly", "ImageData", "HtmlCollection", "EventListenerOptions", "BroadcastChannel", "HtmlDocument",
]
