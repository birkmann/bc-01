[package]
name = "bc-libcore"
version = "0.1.2"
edition = "2024"
description = "Workstream 1 shared base: Ctx, ApiError, library scope, row hydration, task host"

[dependencies]
bc-core = { path = "../bc-core" }
bc-db = { path = "../bc-db" }
bc-types = { path = "../bc-types" }
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# keyring 3 falls back to an in-memory mock store on platforms without an enabled backend, so
# macOS needs its own (Keychain); without it the cookie would be lost on restart.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
