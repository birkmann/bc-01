[package]
name = "bc-maint"
version = "0.1.1"
edition = "2024"
description = "Workstream 1: cleanup, blacklist, strays, completeness, snippets, relocate, tidy, matching, loved"

[dependencies]
bc-core = { path = "../bc-core" }
bc-db = { path = "../bc-db" }
bc-libcore = { path = "../bc-libcore" }
bc-types = { path = "../bc-types" }
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
libc = "0.2"
lofty = "0.25"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
unicode-normalization = "0.1"
walkdir = "2"
strsim = "0.11"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
