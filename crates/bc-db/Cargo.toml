[package]
name = "bc-db"
version = "0.1.4"
edition = "2024"

[dependencies]
bc-core = { version = "0.1.0", path = "../bc-core" }
bc-types = { version = "0.1.0", path = "../bc-types" }
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "blob", "serde_json", "backup"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "rt"] }
tracing = "0.1.44"

serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
