[package]
name = "bc-desktop"
version = "0.1.10"
edition = "2024"
description = "bc desktop app: in-process bc-server + audio engine, UI in a browser app window (Linux) or a native web view window (macOS), single instance."

[dependencies]
bc-core = { path = "../bc-core" }
bc-server = { path = "../bc-server" }
bc-types = { path = "../bc-types" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
tracing = "0.1"
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ksni = "0.3"
# Reads the Bandcamp cookie out of the Firefox sign-in profile (same version as bc-db).
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Turns Window Controls Overlay on in the window profile's web app database (`webapp.rs`).
rusty-leveldb = "4"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4"
muda = "0.21"
tao = "0.37"
wry = "0.57"
