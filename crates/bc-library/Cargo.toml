[package]
name = "bc-library"
version = "0.1.4"
edition = "2024"

[dependencies]
bc-core = { path = "../bc-core" }
bc-db = { path = "../bc-db" }
bc-libcore = { path = "../bc-libcore" }
bc-scan = { path = "../bc-scan" }
bc-maint = { path = "../bc-maint" }
bc-meta = { path = "../bc-meta" }
bc-plist = { path = "../bc-plist" }
bc-media = { path = "../bc-media" }
bc-types = { path = "../bc-types" }
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
csv = "1"
futures = "0.3"
libc = "0.2"
notify = "8"
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.9"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
unicode-normalization = "0.1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
